[project]
name = "fes-mcp"
version = "0.1.0"
description = "Sisense Meta-Management MCP Server — environment operations as AI-ready tools (PySisense SDK)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastmcp>=2.10,<3",
    "httpx>=0.28",
    "jsonschema>=4.21",
    "pysisense==2.0.1",
    "python-dotenv>=1.0",
]

[project.scripts]
fes-mcp = "fes_mcp.__main__:main"
fes-auth = "fes_mcp.authserver:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fes_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
