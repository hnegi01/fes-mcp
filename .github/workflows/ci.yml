name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: uv sync --frozen
      - name: Unit tests
        run: uv run python -m pytest -q
      # Integration tests need real Sisense credentials and are skipped by
      # design in CI (tests/integration/README.md).

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build both service images
        run: |
          docker build --target fes-auth -t fes-auth:ci .
          docker build --target fes-mcp -t fes-mcp:ci .
